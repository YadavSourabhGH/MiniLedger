services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniledger
      POSTGRES_PASSWORD: miniledger_dev
      POSTGRES_DB: miniledger
    ports:
      - "5432:5432"
    volumes:
      - miniledger_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniledger -d miniledger"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  miniledger_pgdata:
